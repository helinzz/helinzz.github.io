<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UnitLab | Unit Converter for Engineers</title>
<meta name="description" content="Fast unit converter for length, mass, pressure, energy, power, torque and temperature. Built for engineering students.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1020; --bg2:#151833; --card:#171a33; --card2:#1d2140; --line:#2a2f57;
  --ink:#eceafb; --muted:#a19fc4; --accent:#b9a4f5; --accent-ink:#1d1640;
  --mint:#9be3bd; --mint-ink:#0f3a27; --shadow:0 20px 50px -24px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#faf8fe; --bg2:#efe8fc; --card:#fff; --card2:#f3effc; --line:#e2dcf2;
  --ink:#2a2540; --muted:#6a6585; --accent:#7c5cc4; --accent-ink:#fff;
  --mint:#dff5e7; --mint-ink:#2f6d4d; --shadow:0 16px 40px -24px rgba(124,92,196,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden;transition:background .3s,color .3s}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
button,select,input{font:inherit;color:inherit}

/* Header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-style:normal}
.logo svg{width:20px;height:20px}
nav{display:flex;align-items:center;gap:6px}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:500;font-size:.93rem;color:var(--muted);transition:background .2s,color .2s}
nav a:hover{background:var(--card2);color:var(--ink)}
.icon{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .2s,border-color .2s}
.icon:hover{transform:translateY(-1px);border-color:var(--accent)}
@media(max-width:560px){nav a.hide-sm{display:none}}

/* Hero */
.hero{text-align:center;padding:64px 0 36px;background:radial-gradient(700px 300px at 50% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
.hero h1{margin:0;font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.08;letter-spacing:-.035em;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:16px auto 0;max-width:46ch;color:var(--muted);font-size:1.05rem}

/* Converter */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted);transition:all .2s}
.tab:hover{color:var(--ink);border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;margin-top:22px}
.field{min-width:0}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);min-width:0}
.field input{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:1.25rem}
.field select{margin-top:10px;cursor:pointer;font-size:.95rem}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.swap{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card2);cursor:pointer;display:grid;place-items:center;margin-bottom:2px;transition:transform .3s,border-color .2s}
.swap:hover{transform:rotate(180deg);border-color:var(--accent)}
.swap svg{width:20px;height:20px}
.result{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:20px;padding:14px 16px;border-radius:12px;background:var(--card2)}
.result code{font-family:'JetBrains Mono',monospace;font-size:.95rem;font-weight:600;color:var(--mint);word-break:break-all}
:root[data-theme="light"] .result code{color:var(--mint-ink)}
.copy{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:.85rem;transition:border-color .2s}
.copy:hover{border-color:var(--accent)}
@media(max-width:620px){
  .row{grid-template-columns:1fr;gap:10px}
  .swap{justify-self:center;margin:0}
  .swap svg{transform:rotate(90deg)}
}

/* Reference */
section{padding:44px 0}
h2{margin:0 0 6px;font-size:1.6rem;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.item{padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:transform .2s,border-color .2s;min-width:0}
.item:hover{transform:translateY(-2px);border-color:var(--accent)}
.item small{display:block;color:var(--muted);font-size:.8rem}
.item b{font-family:'JetBrains Mono',monospace;font-size:1rem;word-break:break-all}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.92rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
footer a{color:var(--accent);text-decoration:none;font-weight:600}
footer a:hover{text-decoration:underline}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="#top" aria-label="UnitLab home">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></i>
      UnitLab
    </a>
    <nav>
      <a href="#converter">Converter</a>
      <a class="hide-sm" href="#reference">Quick reference</a>
      <a class="hide-sm" href="./">Portfolio</a>
      <button class="icon" id="theme" aria-label="Toggle light and dark theme" title="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <h1>Convert units with <span>confidence.</span></h1>
      <p>Length, mass, pressure, energy, power, torque and temperature. Instant results on any device.</p>
    </div>
  </div>

  <section id="converter" style="padding-top:12px">
    <div class="wrap">
      <div class="panel">
        <div class="tabs" id="tabs" role="tablist" aria-label="Unit category"></div>
        <div class="row">
          <div class="field">
            <label for="vFrom">From</label>
            <input id="vFrom" type="text" inputmode="decimal" autocomplete="off" value="1" aria-label="Value to convert">
            <select id="uFrom" aria-label="From unit"></select>
          </div>
          <button class="swap" id="swap" aria-label="Swap units" title="Swap units">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
          </button>
          <div class="field">
            <label for="vTo">To</label>
            <input id="vTo" type="text" inputmode="decimal" autocomplete="off" aria-label="Converted value">
            <select id="uTo" aria-label="To unit"></select>
          </div>
        </div>
        <div class="result">
          <code id="formula" aria-live="polite"></code>
          <button class="copy" id="copy">Copy result</button>
        </div>
      </div>
    </div>
  </section>

  <section id="reference" style="padding-top:12px">
    <div class="wrap">
      <h2 id="refTitle">Quick reference</h2>
      <p class="sub" id="refSub"></p>
      <div class="grid" id="refGrid"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="year">2026</span> UnitLab. Made by Helin Zan.</span>
    <a href="./">Back to portfolio</a>
  </div>
</footer>

<script>
/* Each unit: [symbol, name, factor to base unit]. Base units: m, kg, Pa, J, W, N·m.
   To add a unit, add a line to the right category. Temperature is handled separately. */
var DATA = {
  Length:[["m","Meter",1],["km","Kilometer",1000],["cm","Centimeter",0.01],["mm","Millimeter",0.001],["µm","Micrometer",1e-6],["in","Inch",0.0254],["ft","Foot",0.3048],["yd","Yard",0.9144],["mi","Mile",1609.344],["nmi","Nautical mile",1852]],
  Mass:[["kg","Kilogram",1],["g","Gram",0.001],["mg","Milligram",1e-6],["t","Metric ton",1000],["lb","Pound",0.45359237],["oz","Ounce",0.028349523125]],
  Pressure:[["Pa","Pascal",1],["kPa","Kilopascal",1e3],["MPa","Megapascal",1e6],["bar","Bar",1e5],["mbar","Millibar",100],["atm","Atmosphere",101325],["psi","Pound per sq in",6894.757293168],["mmHg","Millimeter of mercury",133.322387415]],
  Energy:[["J","Joule",1],["kJ","Kilojoule",1e3],["MJ","Megajoule",1e6],["Wh","Watt-hour",3600],["kWh","Kilowatt-hour",3.6e6],["cal","Calorie",4.184],["kcal","Kilocalorie",4184],["BTU","British thermal unit",1055.05585262],["eV","Electronvolt",1.602176634e-19]],
  Power:[["W","Watt",1],["kW","Kilowatt",1e3],["MW","Megawatt",1e6],["GW","Gigawatt",1e9],["hp","Horsepower (mechanical)",745.69987158227],["PS","Metric horsepower",735.49875],["BTU/h","BTU per hour",0.29307107]],
  Torque:[["N·m","Newton-meter",1],["kN·m","Kilonewton-meter",1e3],["N·cm","Newton-centimeter",0.01],["lbf·ft","Pound-force foot",1.3558179483314],["lbf·in","Pound-force inch",0.1129848290276],["kgf·m","Kilogram-force meter",9.80665]],
  Temperature:[["°C","Celsius"],["K","Kelvin"],["°F","Fahrenheit"],["°R","Rankine"]]
};
var DEFAULTS = {Length:["m","ft"],Mass:["kg","lb"],Pressure:["bar","psi"],Energy:["kWh","MJ"],Power:["kW","hp"],Torque:["N·m","lbf·ft"],Temperature:["°C","°F"]};

var cat = "Length";
var $ = function(id){return document.getElementById(id)};
var tabs=$("tabs"), vFrom=$("vFrom"), vTo=$("vTo"), uFrom=$("uFrom"), uTo=$("uTo");

function toC(v,u){ return u==="°C"?v : u==="K"?v-273.15 : u==="°F"?(v-32)*5/9 : (v-491.67)*5/9; }
function fromC(c,u){ return u==="°C"?c : u==="K"?c+273.15 : u==="°F"?c*9/5+32 : (c+273.15)*9/5; }
function factor(sym){ var l=DATA[cat]; for(var i=0;i<l.length;i++) if(l[i][0]===sym) return l[i][2]; }
function convert(v,from,to){
  if(cat==="Temperature") return fromC(toC(v,from),to);
  return v*factor(from)/factor(to);
}
function fmt(n){
  if(!isFinite(n)) return "";
  if(n===0) return "0";
  var a=Math.abs(n);
  if(a>=1e12||a<1e-6) return n.toExponential(6).replace(/\.?0+e/,"e");
  return String(parseFloat(n.toPrecision(10)));
}
function parse(t){ return parseFloat(String(t).trim().replace(",",".")); }

function fillSelects(){
  var opts=DATA[cat].map(function(u){return '<option value="'+u[0]+'">'+u[0]+' — '+u[1]+'</option>'}).join("");
  uFrom.innerHTML=opts; uTo.innerHTML=opts;
  uFrom.value=DEFAULTS[cat][0]; uTo.value=DEFAULTS[cat][1];
}
function update(side){
  var from=uFrom.value, to=uTo.value;
  if(side==="to"){
    var t=parse(vTo.value);
    vFrom.value = isNaN(t) ? "" : fmt(convert(t,to,from));
  } else {
    var f=parse(vFrom.value);
    vTo.value = isNaN(f) ? "" : fmt(convert(f,from,to));
  }
  var one=convert(1,from,to);
  $("formula").textContent="1 "+from+" = "+fmt(one)+" "+to;
  renderRef();
}
function renderRef(){
  var from=uFrom.value, name="";
  DATA[cat].forEach(function(u){ if(u[0]===from) name=u[1]; });
  $("refTitle").textContent="1 "+from+" in other units";
  $("refSub").textContent=cat+" · "+name;
  $("refGrid").innerHTML=DATA[cat].filter(function(u){return u[0]!==from}).map(function(u){
    return '<div class="item"><small>'+u[1]+'</small><b>'+fmt(convert(1,from,u[0]))+' '+u[0]+'</b></div>';
  }).join("");
}
function buildTabs(){
  tabs.innerHTML=Object.keys(DATA).map(function(k){
    return '<button class="tab" role="tab" aria-selected="'+(k===cat)+'" data-cat="'+k+'">'+k+'</button>';
  }).join("");
}
tabs.addEventListener("click",function(e){
  var b=e.target.closest(".tab"); if(!b) return;
  cat=b.dataset.cat; buildTabs(); fillSelects(); vFrom.value="1"; update("from");
});
vFrom.addEventListener("input",function(){update("from")});
vTo.addEventListener("input",function(){update("to")});
uFrom.addEventListener("change",function(){update("from")});
uTo.addEventListener("change",function(){update("from")});
$("swap").addEventListener("click",function(){
  var a=uFrom.value; uFrom.value=uTo.value; uTo.value=a;
  var v=vTo.value; if(v!=="") vFrom.value=v;
  update("from");
});
$("copy").addEventListener("click",function(){
  var b=$("copy"), txt=vTo.value+" "+uTo.value;
  try{ navigator.clipboard.writeText(txt); b.textContent="Copied"; }catch(e){ b.textContent="Press Ctrl+C"; }
  setTimeout(function(){b.textContent="Copy result"},1500);
});

/* Theme toggle (remembered on this device when storage is available) */
var root=document.documentElement;
try{ var saved=localStorage.getItem("unitlab-theme"); if(saved) root.dataset.theme=saved; }catch(e){}
$("theme").addEventListener("click",function(){
  var next=root.dataset.theme==="dark"?"light":"dark";
  root.dataset.theme=next;
  try{ localStorage.setItem("unitlab-theme",next); }catch(e){}
});
$("year").textContent=new Date().getFullYear();

buildTabs(); fillSelects(); update("from");
</script>
</body>
</html>
